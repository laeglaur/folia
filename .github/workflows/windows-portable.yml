name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-portable]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/portable-paths-smoke.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build window test executable
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $config.app.windows[0] | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "--remote-debugging-port=9222" -Force
          @{ app = @{ windows = $config.app.windows } } | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.smoke.conf.json
          pnpm tauri build --no-bundle --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.smoke.conf.json
      - name: Test portable startup
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "folia-portable-smoke"
          New-Item -ItemType Directory -Path $testDir -Force
          Copy-Item src-tauri/target/release/block_first_notebook.exe "$testDir/folia.exe"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $debugKey = "HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $debugKey -Force | Out-Null
          New-ItemProperty -Path $debugKey -Name "folia.exe" -Value "--remote-debugging-port=9222" -PropertyType String -Force | Out-Null
          $app = Start-Process "$testDir/folia.exe" -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 15
            if ($app.HasExited) { throw "App exited during startup: $($app.ExitCode)" }
            if (!(Test-Path "$testDir/data/notebook.sqlite3")) { throw "Portable database was not created" }
            if (!(Test-Path "$testDir/data/webview")) { throw "Portable WebView profile was not created" }
            node scripts/windows-window-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Window interaction checks failed" }
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -like '*webview*' -or $_.Name -eq 'folia.exe' } | Select-Object Name,CommandLine | Format-List
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Build distributable without diagnostic port
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.windows.conf.json
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable/data -Force
          Copy-Item src-tauri/target/release/block_first_notebook.exe portable/folia.exe
          Copy-Item docs/windows-portable.md portable/README.md
          Compress-Archive -Path portable/* -DestinationPath folia-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: folia-windows-x64-portable
          path: folia-windows-x64-portable.zip
